name: Build Debian Trixie package

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Optional upstream tag (defaults to newest version tag)'
        required: false

permissions:
  contents: write

concurrency:
  group: mate-appmenu-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install tools and build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 xz-utils gh devscripts dpkg-dev \
            debhelper meson ninja-build pkgconf valac libglib2.0-dev \
            libgtk-3-dev libgtk2.0-dev libwnck-3-dev \
            libmate-panel-applet-dev libdbusmenu-glib-dev libjson-glib-dev \
            libx11-dev libxkbcommon-dev systemd-dev \
            gobject-introspection libgirepository1.0-dev default-jdk
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch tagged source
        run: git clone --tags https://gitlab.com/KeremSoke/mate-appmenu.git /tmp/mate-appmenu-source
      - name: Plan package and generate changelog
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 scripts/build.py \
            --source-dir /tmp/mate-appmenu-source \
            --packaging-dir "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            ${SOURCE_TAG:+--source-tag "$SOURCE_TAG"}
      - name: Build binary and source packages
        if: steps.plan.outputs.build == 'true'
        working-directory: dist
        run: |
          tree=$(python3 -c 'import json; print(json.load(open("build.json"))["tree"])')
          cd "$tree"
          dpkg-buildpackage -us -uc -sa
      - name: Publish release artifacts
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.deb dist/*.dsc dist/*.changes \
            dist/*.buildinfo dist/*.tar.xz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mate-appmenu $VERSION (Debian Trixie)" \
            --notes-file dist/release-body.md
